name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Real Postgres and Redis for the e2e tests, same versions as infra/.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twitter
          POSTGRES_PASSWORD: twitter
          POSTGRES_DB: twitter
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U twitter -d twitter"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://twitter:twitter@localhost:5432/twitter
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
