name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Real Postgres and Redis for the e2e tests, same versions as infra/.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twitter
          POSTGRES_PASSWORD: twitter
          POSTGRES_DB: twitter
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U twitter -d twitter"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # S3-compatible storage and search, same versions as infra/.
      storage:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: twitter
          RUSTFS_SECRET_KEY: twitter-dev-secret
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fs http://localhost:9000/health"
          --health-interval 2s --health-timeout 3s --health-retries 30
      search:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_MASTER_KEY: twitter-dev-master-key
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
        options: >-
          --health-cmd "curl -fs http://localhost:7700/health"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://twitter:twitter@localhost:5432/twitter
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
