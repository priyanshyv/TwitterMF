name: twittermf

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: twitter
      POSTGRES_PASSWORD: twitter
      POSTGRES_DB: twitter
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twitter -d twitter']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    # appendonly: Redis logs every write to disk, so data survives a restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for uploaded images. RustFS speaks the same
  # API as AWS S3 and Cloudflare R2, so moving to R2 later is a config change.
  # (MinIO stopped publishing free Docker images in 2025.)
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: twitter
      RUSTFS_SECRET_KEY: twitter-dev-secret
    ports:
      - '9000:9000'
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/health']
      interval: 2s
      timeout: 3s
      retries: 30

  # Full-text search: typo tolerance, ranking, filters. Fed from Postgres
  # through the outbox, so it's a derived copy that can always be rebuilt.
  search:
    image: getmeili/meilisearch:v1.55.0
    environment:
      MEILI_MASTER_KEY: twitter-dev-master-key
      MEILI_NO_ANALYTICS: 'true'
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - searchdata:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:7700/health']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
  storagedata:
  searchdata:
